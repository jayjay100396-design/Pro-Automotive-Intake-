<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e18">
  <meta name="application-name" content="Stellar Glass">
  <meta name="apple-mobile-web-app-title" content="Stellar Glass">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="msapplication-TileColor" content="#090e18">
  <meta name="msapplication-TileImage" content="/img/icon-192.png">
  <meta name="description" content="Stellar Glass: estimates, contracts, pay apps and invoices for commercial storefronts and showers in Central Florida.">
  <title>Stellar Glass</title>
  <!-- Dark office mode unless this device chose daylight mode (sidebar button). Set before paint. -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('stellar-theme') === 'light' ? 'light' : 'dark'; } catch (e) { /* private mode */ }</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="loading" role="status" aria-live="polite">Loading…</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
